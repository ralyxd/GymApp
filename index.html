<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0e1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<title>Gym Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0e1013;--card:#171a20;--card2:#20242c;--line:#2a2f39;--text:#eef1f5;--mute:#8b93a1;--acc:#de5b5b;--accsoft:rgba(222,91,91,.15);--acclt:#f4a5a5;--ok:#2fbf71;--warn:#ff7a5c;--r:14px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.wk{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,19,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);min-height:56px}
header h1{font-size:22px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1.sm{font-size:17px}
main{padding:12px 16px 24px;max-width:640px;margin:0 auto}
h2::before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--acc);margin-right:8px;vertical-align:1px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#12151a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 0 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button.on{color:var(--acc)}
svg{width:22px;height:22px;display:block}
body.wk nav,body.wk #banner{display:none}
#banner{position:fixed;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;display:none;z-index:6;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#banner.show{display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.card.hl{border-color:var(--acc);background:linear-gradient(135deg,var(--accsoft),var(--card) 60%)}
.card.rt{border-left:3px solid var(--acc)}
.btn.soft{background:var(--accsoft);color:var(--acclt)}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--acc),transparent 70%)}
.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.acc{color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 15px inherit;font-family:inherit;background:var(--card2);color:var(--text);cursor:pointer}
.btn.pri{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:transparent;color:var(--warn);border:1px solid #4a2f2a}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--acc)}
.btn.full{width:100%;margin-top:8px}
.btn.sm{padding:7px 10px;font-size:14px}
.optbtn{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;font:600 13.5px inherit;font-family:inherit;cursor:pointer}
.optbtn svg{width:18px;height:18px}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:14px;margin-top:10px;font:15px inherit;font-family:inherit;cursor:pointer}
.bigbtn .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.bigbtn.red{color:var(--warn)}
.iconbtn{background:none;border:0;color:var(--mute);font-size:20px;padding:4px 8px;cursor:pointer;font-family:inherit}
.fab{box-shadow:0 6px 20px rgba(222,91,91,.4)!important;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:4;cursor:pointer}
input,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px inherit;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--acc)}
label{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 0}
label input,label select{margin-top:5px}
.lbl{font-size:12.5px;color:var(--mute);margin:14px 0 6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{display:inline-block;font-size:11.5px;background:var(--accsoft);color:var(--acclt);border-radius:6px;padding:2px 7px;margin:4px 4px 0 0}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}
.t0{background:#1d2c48;color:#8db4ff}.t1{background:#45311a;color:#ffb871}.t2{background:#33224a;color:#c9a2ff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:9px 0;text-align:center}
.dmini{display:inline-flex;gap:3px}
.dmini span{font-size:10.5px;width:17px;height:17px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);color:#555c68}
.dmini span.on{background:var(--accsoft);color:var(--acclt)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:7px 0;border-radius:8px;font:600 12.5px inherit;font-family:inherit}
.seg button.on{background:var(--card2);color:var(--text)}
/* workout */
.restrow{display:flex;align-items:center;gap:6px;margin:8px 0 4px;font-size:13px;color:var(--mute)}
.restrow input{width:70px;padding:5px 8px;font-size:15px;text-align:center}
.sh,.srow{display:grid;grid-template-columns:34px 1fr 68px 58px 42px;gap:6px;align-items:center}
.sh{font-size:11px;color:var(--mute);text-transform:uppercase;margin-top:6px;padding:0 2px}
.sh span:nth-child(n+3){text-align:center}
.srow{padding:4px 2px;border-radius:8px;margin-top:3px}
.srow input{padding:7px 4px;text-align:center;font-size:16px}
.srow .sn{text-align:center;font-weight:700;color:var(--mute);cursor:pointer}
.srow .prev{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{height:36px;border-radius:8px;border:0;background:var(--card2);color:var(--mute);font-size:17px;font-weight:700;cursor:pointer}
.srow.done{background:rgba(47,191,113,.14)}
.srow.done .chk{background:var(--ok);color:#fff}
.srow.done input{background:transparent;border-color:transparent}
#timer{position:fixed;left:0;right:0;bottom:0;background:#12151a;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:7;display:none}
#timer.show{display:block}
#timer .tbar{height:4px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:8px}
#timer .tbar i{display:block;height:100%;background:var(--acc);width:0}
#timer b{font-size:26px;font-variant-numeric:tabular-nums;flex:1;text-align:center}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:20;transition:background .2s;display:flex;align-items:flex-end;justify-content:center}
.overlay.show{background:rgba(0,0,0,.55)}
.sheet{background:#13161b;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease;overscroll-behavior:contain}
.overlay.show .sheet{transform:none}
.shead{position:sticky;top:0;background:#13161b;display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px;z-index:2}
.shead b{flex:1;text-align:center;font-size:16px}
.shead button{background:none;border:0;color:var(--mute);font:600 15px inherit;font-family:inherit;padding:4px;cursor:pointer;min-width:70px;text-align:left}
.shead button:last-child{text-align:right}
.shead button.acc{color:var(--acc)}
.ritem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid3 label{margin-top:6px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pitem .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.pitem.on .box{background:var(--acc);border-color:var(--acc)}
.stick{position:sticky;bottom:0;background:#13161b;padding:10px 0 0}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:14px 4px;font:16px inherit;font-family:inherit;cursor:pointer}
.menu button.red{color:var(--warn)}
.stat{display:flex;gap:16px;margin-top:6px;font-size:12.5px;color:var(--mute)}
.stat b{color:var(--text)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-120px);background:#2a2f39;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;transition:transform .25s;font-size:14px;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
/* celebraciones */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.cel{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(5,6,8,0);transition:background .4s;overflow:hidden}
.cel.show{background:rgba(5,6,8,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cel .rays{position:absolute;left:50%;top:50%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;background:repeating-conic-gradient(from 0deg,rgba(255,200,80,.12) 0 9deg,transparent 9deg 18deg);animation:spin 40s linear infinite;opacity:0;transition:opacity 1.2s;pointer-events:none}
.cel.t3 .rays{background:repeating-conic-gradient(from 0deg,rgba(120,170,255,.09) 0 9deg,transparent 9deg 18deg)}
.cel.show .rays{opacity:1}
.cel .glow{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,80,.28),transparent 65%);pointer-events:none;animation:pulse 2.4s ease-in-out infinite}
.celbox{position:relative;text-align:center;max-width:360px;width:100%;transform:scale(.6);opacity:0;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.cel.show .celbox{transform:none;opacity:1}
.celemoji{font-size:84px;line-height:1.1;display:inline-block;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both,float 3s ease-in-out .9s infinite}
.cel.t3 .celemoji{font-size:96px;filter:drop-shadow(0 0 22px rgba(255,200,80,.55))}
.cel.t4 .celemoji{font-size:118px;filter:drop-shadow(0 0 34px rgba(255,200,80,.8))}
.celn{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-top:14px}
.celbig{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px;background:linear-gradient(180deg,#fff,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
.celt{font-size:27px;font-weight:800;margin:8px 0 8px}
.cel.t3 .celt,.cel.t4 .celt{background:linear-gradient(90deg,#ffd76a,#fff6cf,#ffb340,#ffd76a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.5s linear infinite}
.celm{color:#cfd5de;font-size:15px}
.celstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
.celstats div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 6px;opacity:0;animation:rise .5s ease forwards}
.celstats b{display:block;font-size:19px}
.celstats span{font-size:11.5px;color:var(--mute)}
.celfun{font-size:14px;color:#ffd76a;margin-top:12px;opacity:0;animation:rise .6s ease 1.2s forwards}
.celbtn{margin-top:22px;min-width:160px}
.celtap{font-size:11.5px;color:var(--mute);margin-top:10px}
@keyframes pop{0%{transform:scale(0) rotate(-35deg)}100%{transform:scale(1) rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:200% center}}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* logros */
.achcard{display:flex;align-items:center;gap:12px}
.achcard .big{font-size:34px}
.prog{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ffb38a);border-radius:6px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.medal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;font-family:inherit;color:var(--text)}
.medal .e{font-size:34px;line-height:1.2}
.medal .n{font-size:11.5px;color:var(--mute)}
.medal .tt{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.25}
.medal.lock{opacity:.45;cursor:default}
.medal.g2{border-color:#2c4a80}
.medal.g3{border-color:#7a6224}
.medal.g4{border-color:#d4a83a;box-shadow:0 0 14px rgba(255,200,80,.25)}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="banner" data-a="resume"></div>
<nav id="nav"></nav>
<div id="timer">
  <div class="tbar"><i id="tprog"></i></div>
  <div class="row">
    <button class="btn sm" data-a="restAdj" data-d="-15">−15</button>
    <b id="tleft">0:00</b>
    <button class="btn sm" data-a="restAdj" data-d="15">+15</button>
    <button class="btn sm pri" data-a="restSkip">Saltar</button>
  </div>
</div>
<div id="sheets"></div>
<div id="toast"></div>
<input type="file" id="impf" accept="application/json,.json" hidden>
<script>
const DAYS=['L','M','X','J','V','S','D'];
const DAY_FULL=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const TYPES=['Máquina','Peso libre','Polea'];
const DEFAULT_TAGS=['Pecho','Espalda','Hombro','Bíceps','Tríceps','Antebrazo','Trapecio','Cuádriceps','Isquios','Glúteo','Gemelo','Abdomen','Lumbar'];
const KEY='gymlog.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const todayIdx=()=>(new Date().getDay()+6)%7;

function blank(){return{exercises:[],routines:[],history:[],active:null,tags:[...DEFAULT_TAGS]}}
function seed(b){
  const S=[['Press banca',1,['Pecho','Tríceps']],['Press inclinado mancuernas',1,['Pecho','Hombro']],['Aperturas en polea',2,['Pecho']],
  ['Jalón al pecho',2,['Espalda','Bíceps']],['Remo con barra',1,['Espalda']],['Remo en máquina',0,['Espalda']],
  ['Press militar',1,['Hombro','Tríceps']],['Elevaciones laterales',1,['Hombro']],['Curl bíceps con barra',1,['Bíceps']],
  ['Extensión tríceps en polea',2,['Tríceps']],['Sentadilla',1,['Cuádriceps','Glúteo']],['Prensa',0,['Cuádriceps','Glúteo']],
  ['Curl femoral',0,['Isquios']],['Peso muerto rumano',1,['Isquios','Glúteo','Lumbar']],['Gemelo en máquina',0,['Gemelo']],['Crunch en polea',2,['Abdomen']]];
  b.exercises=S.map(([n,t,tags])=>({id:uid(),name:n,type:TYPES[t],tags}));
}
function load(){
  try{const s=localStorage.getItem(KEY);if(s)return Object.assign(blank(),JSON.parse(s));}catch(e){}
  const b=blank();seed(b);return b;
}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('No se pudo guardar')}}
save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const getEx=id=>db.exercises.find(x=>x.id===id);
const typeCls=t=>'t'+Math.max(0,TYPES.indexOf(t));
function fmtDur(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function fmtW(w){return (+w||0).toLocaleString('es-ES',{maximumFractionDigits:2})}
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

const ic=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
  train:ic('<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>'),
  routines:ic('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
  exercises:ic('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
  history:ic('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  gear:ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>')
};
const NAV=[['train','Entrenar'],['routines','Rutinas'],['exercises','Ejercicios'],['history','Historial']];

let view='train';
let exFilter={q:'',tag:null,type:null};
let rFilter=null;

/* ---------- RENDER ---------- */
function render(){
  if(view==='workout'&&db.active){renderWorkout();return}
  if(view==='workout')view='train';
  document.body.classList.remove('wk');keepAwake(false);
  document.getElementById('timer').classList.remove('show');
  document.getElementById('nav').innerHTML=NAV.map(([v,l])=>`<button data-a="nav" data-v="${v}" class="${view===v?'on':''}">${IC[v]}${l}</button>`).join('');
  const title=NAV.find(n=>n[0]===view)[1];
  document.getElementById('hdr').innerHTML=`<h1>${title}</h1><button class="optbtn" data-a="settings">${IC.gear}<span>Opciones</span></button>`;
  const m=document.getElementById('main');
  if(view==='train')m.innerHTML=vTrain();
  else if(view==='routines')m.innerHTML=vRoutines();
  else if(view==='exercises'){m.innerHTML=vExercises();renderExList()}
  else if(view==='history')m.innerHTML=vHistory();
  const b=document.getElementById('banner');
  if(db.active){b.classList.add('show');b.innerHTML=`<span class="grow">▶ ${esc(db.active.name)}</span><span data-elapsed></span>`}else b.classList.remove('show');
  tick();
}

function dmini(days){return `<span class="dmini">${DAYS.map((d,i)=>`<span class="${days.includes(i)?'on':''}">${d}</span>`).join('')}</span>`}

function vExercises(){

  <div class="chips"><button class="chip ${!exFilter.tag?'on':''}" data-a="exTagF" data-t="">Todos</button>${db.tags.map(t=>`<button class="chip ${exFilter.tag===t?'on':''}" data-a="exTagF" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>

function filterEx(f){const q=norm(f.q||'');return db.exercises.filter(x=>(!q||norm(x.name).includes(q))&&(!f.tag||x.tags.includes(f.tag))&&(!f.type||x.type===f.type)).sort((a,b)=>a.name.localeCompare(b.name,'es'))}

function volume(h){return h.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.w||0)*(+s.r||0),0),0)}
function vHistory(){

/* ---------- WORKOUT ---------- */
function prevSets(exId){for(const h of db.history){const e=h.exercises.find(x=>x.exId===exId);if(e)return e.sets}return []}
function mkWEx(exId,sets=3,reps='',rest=90){const ex=getEx(exId);if(!ex)return null;return{exId,name:ex.name,type:ex.type,rest:+rest||0,target:reps||'',sets:Array.from({length:Math.max(1,+sets||1)},()=>({w:'',r:'',done:false}))}}
function startWorkout(r,from){
  if(db.active&&!confirm('Ya hay un entrenamiento en curso. ¿Descartarlo y empezar otro?'))return;
  let exs;
  if(from){ // repetir un entreno del historial: mismos ejercicios, series y descansos, con sus pesos/reps como guía
    exs=from.exercises.map(e=>{const ex=getEx(e.exId);return{exId:e.exId,name:ex?ex.name:e.name,type:ex?ex.type:(e.type||''),rest:e.rest??90,target:'',
      sets:e.sets.map(s=>({w:'',r:'',done:false,pw:s.w,pr:s.r}))}});
  }else exs=(r?r.items:[]).map(it=>mkWEx(it.exId,it.sets,it.reps,it.rest)).filter(Boolean);
  db.active={id:uid(),routineId:from?from.routineId:(r?r.id:null),name:from?from.name:(r?r.name:'Entrenamiento libre'),start:Date.now(),restEnd:0,restTotal:0,exercises:exs};
  while(stack.length)closeSheet();
  save();view='workout';window.scrollTo(0,0);render();
  if(from)toast('Repitiendo «'+from.name+'» 🔁');
}
function repeatWorkout(id){const h=db.history.find(x=>x.id===id);if(h)startWorkout(null,h)}
function renderWorkout(){
  const a=db.active,y=window.scrollY;
  document.body.classList.add('wk');keepAwake(true);
  document.getElementById('hdr').innerHTML=`<button class="iconbtn" data-a="minimize" aria-label="Minimizar">⌄</button><div class="grow"><h1 class="sm">${esc(a.name)}</h1><div class="mute small" data-elapsed></div></div><button class="btn ok sm" data-a="finish">Terminar</button>`;
  let h=a.exercises.map((e,i)=>{
    const prev=prevSets(e.exId),tgt=parseInt(e.target)||'';
    return `<div class="card"><div class="row"><div class="grow"><b class="acc">${esc(e.name)}</b><div class="mute small">${esc(e.type)}${e.target?` · objetivo ${esc(e.target)} reps`:''}</div></div><button class="iconbtn" data-a="wexMenu" data-i="${i}">⋯</button></div>
    <div class="restrow">Descanso <input type="number" inputmode="numeric" min="0" data-wf="rest" data-i="${i}" value="${e.rest}"> s</div>
    <div class="sh"><span>Serie</span><span>Anterior</span><span>kg</span><span>Reps</span><span></span></div>
    ${e.sets.map((s,j)=>{const p=prev[j];return `<div class="srow ${s.done?'done':''}"><span class="sn" data-a="delSet" data-i="${i}" data-j="${j}">${j+1}</span>
      <span class="prev">${p?`${fmtW(p.w)} × ${p.r}`:'—'}</span>
      <input type="number" inputmode="decimal" step="any" data-wf="w" data-i="${i}" data-j="${j}" value="${esc(s.w)}" placeholder="${s.pw!=null?esc(s.pw):p?esc(p.w):''}">
      <input type="number" inputmode="numeric" data-wf="r" data-i="${i}" data-j="${j}" value="${esc(s.r)}" placeholder="${s.pr!=null?esc(s.pr):p?esc(p.r):tgt}">
      <button class="chk" data-a="toggle" data-i="${i}" data-j="${j}">✓</button></div>`}).join('')}
    <button class="btn ghost full sm" data-a="addSet" data-i="${i}">+ Añadir serie</button></div>`}).join('');
  if(!a.exercises.length)h+=`<p class="empty">Añade ejercicios para empezar.</p>`;
  h+=`<button class="btn ghost full" data-a="wAddEx">+ Añadir ejercicio</button><button class="btn danger full" style="margin-top:24px" data-a="cancelWk">Cancelar entrenamiento</button>`;
  document.getElementById('main').innerHTML=h;
  window.scrollTo(0,y);tick();
}
function toggleSet(i,j){
  const e=db.active.exercises[i],s=e.sets[j];
  if(!s.done){
    const p=prevSets(e.exId)[j];
    if(s.w==='')s.w=s.pw!=null?String(s.pw):p?String(p.w):'';
    if(s.r==='')s.r=s.pr!=null?String(s.pr):p?String(p.r):(parseInt(e.target)?String(parseInt(e.target)):'');
    if(s.r===''){toast('Indica las repeticiones');return}
    s.done=true;startRest(e.rest);
  }else s.done=false;
  save();renderWorkout();
}
function finishWorkout(){
  const a=db.active;
  const done=a.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  if(!done.length){if(confirm('No has completado ninguna serie. ¿Descartar el entrenamiento?')){db.active=null;save();view='train';render()}return}
  const pend=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);
  if(!confirm(pend?`Hay ${pend} serie${pend>1?'s':''} sin marcar que no se guardará${pend>1?'n':''}. ¿Terminar?`:'¿Terminar entrenamiento?'))return;
  const h={id:uid(),routineId:a.routineId,name:a.name,start:a.start,end:Date.now(),
    exercises:done.map(e=>({exId:e.exId,name:e.name,type:e.type,rest:e.rest,sets:e.sets.map(s=>({w:+s.w||0,r:+s.r||0}))}))};
  db.history.unshift(h);db.active=null;save();
  const nw=syncAch();
  view='history';window.scrollTo(0,0);render();openHistory(h.id);
  if(nw.length)setTimeout(()=>celebrate(nw[nw.length-1]),450);else toast('¡Entrenamiento guardado! 💪');
}

/* ---------- REST TIMER ---------- */
let alerted=true,actx=null;
function unlockAudio(){try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)()}if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.18);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch(e){}}
function startRest(sec){sec=+sec||0;if(!sec)return;db.active.restEnd=Date.now()+sec*1000;db.active.restTotal=sec;alerted=false;save();tick()}
function tick(){
  const a=db.active,now=Date.now();
  document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=a?fmtDur(now-a.start):'');
  const tm=document.getElementById('timer');
  if(a&&view==='workout'&&a.restEnd>now){
    const left=a.restEnd-now;tm.classList.add('show');
    document.getElementById('tleft').textContent=fmtDur(left+999);
    document.getElementById('tprog').style.width=(100*(1-left/(a.restTotal*1000)))+'%';
  }else{
    tm.classList.remove('show');
    if(a&&a.restEnd&&a.restEnd<=now){a.restEnd=0;save();if(!alerted){alerted=true;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}beep();toast('⏰ ¡Descanso terminado!')}}
  }
}
setInterval(tick,250);

let wl=null;
async function keepAwake(on){try{if(on&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){const w=wl;wl=null;w.release()}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(view==='workout'&&db.active)keepAwake(true);tick()}});

/* ---------- SHEETS ---------- */
const stack=[];
function openSheet(fn){const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="sheet"></div>';document.getElementById('sheets').appendChild(ov);const s={ov,fn};stack.push(s);paint(s);requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('show')));document.body.classList.add('noscroll')}
function paint(s){const sh=s.ov.firstChild,st=sh.scrollTop;sh.innerHTML=s.fn();sh.scrollTop=st}
function refreshSheet(){const s=stack[stack.length-1];if(s)paint(s)}
function closeSheet(){const s=stack.pop();if(!s)return;s.ov.classList.remove('show');setTimeout(()=>s.ov.remove(),230);if(!stack.length)document.body.classList.remove('noscroll')}
const shead=(title,right,ra)=>`<div class="shead"><button data-a="close">Cancelar</button><b>${title}</b>${right?`<button class="acc" data-a="${ra}">${right}</button>`:'<button></button>'}</div>`;

    `<label>Nombre<input data-xf="name" value="${esc(draftEx.name)}" placeholder="Ej. Press banca"></label>

    <div class="row" style="margin-top:10px"><input id="newtag" placeholder="Nuevo grupo muscular…"><button class="btn sm" data-a="addTag">Añadir</button></div>`;

function saveEx(){

    case 'import':document.getElementById('impf').click();break;
    case 'wipe':if(confirm('¿Borrar TODOS los datos? No se puede deshacer.')&&confirm('¿Seguro del todo?')){db=blank();seed(db);save();closeSheet();view='train';render();toast('Datos borrados')}break;
  }
});

function syncAch(){
  if(!db.ach)db.ach={};
  const c=db.history.length,nw=[];
  const starts=db.history.map(h=>h.start).sort((a,b)=>a-b);
  MILESTONES.forEach(m=>{if(m.n<=c&&!db.ach[m.n]){db.ach[m.n]=starts[m.n-1]||Date.now();nw.push(m)}});
  if(nw.length)save();
  return nw;
}
function totals(){
  let vol=0,sets=0,ms=0;
  db.history.forEach(h=>{ms+=Math.max(0,h.end-h.start);h.exercises.forEach(e=>e.sets.forEach(s=>{sets++;vol+=(+s.w||0)*(+s.r||0)}))});
  return {vol,sets,hours:ms/3600000,n:db.history.length};
}
function funLine(vol){
  let pick=null;for(const f of FUN)if(vol>=f[2])pick=f;
  if(!pick)return '';
  const x=vol/pick[2];
  return `${pick[1]} En total has movido el peso de ${x<10?x.toLocaleString('es-ES',{maximumFractionDigits:1}):Math.floor(x).toLocaleString('es-ES')} ${x>=1.05?'veces ':''}${pick[0]}`;
}

/* motor de partículas */
const FX={c:null,x:null,p:[],raf:0,last:0,show:null,
  init(){if(this.c)return;const c=document.createElement('canvas');c.id='fx';document.body.appendChild(c);this.c=c;this.x=c.getContext('2d');this.resize();addEventListener('resize',()=>this.resize())},
  resize(){const d=Math.min(2,devicePixelRatio||1);this.c.width=innerWidth*d;this.c.height=innerHeight*d;this.x.setTransform(d,0,0,d,0,0)},
  start(){this.init();if(!this.raf){this.last=performance.now();this.raf=requestAnimationFrame(t=>this.loop(t))}},
  loop(t){
    const k=Math.min(3,(t-this.last)/16.67);this.last=t;
    const x=this.x,W=innerWidth,H=innerHeight;x.clearRect(0,0,W,H);
    const keep=[];
    for(const p of this.p){
      p.life-=p.decay*k;if(p.life<=0||p.y>H+40)continue;
      if(p.k==='conf'){p.vy+=.16*k;p.vx*=Math.pow(.99,k);p.vy=Math.min(p.vy,4.5);p.x+=(p.vx+Math.sin(p.ph+=.08*k)*.8)*k;p.y+=p.vy*k;p.r+=p.vr*k;
        x.save();x.globalAlpha=Math.min(1,p.life*2);x.translate(p.x,p.y);x.rotate(p.r);x.scale(1,Math.cos(p.ph*1.3));x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();}
      else if(p.k==='rock'){p.vy+=.06*k;p.x+=p.vx*k;p.y+=p.vy*k;
        if(Math.random()<.7)keep.push({k:'spark',x:p.x,y:p.y,vx:(Math.random()-.5)*.6,vy:Math.random()*.8,c:'#ffd9a0',life:.5,decay:.03,s:1.4,g:.02});
        if(p.vy>-1.2){this.boom(p.x,p.y,p.c,p.big);continue}
        x.globalCompositeOperation='lighter';x.fillStyle='#fff3d6';x.beginPath();x.arc(p.x,p.y,2.2,0,7);x.fill();x.globalCompositeOperation='source-over';}
      else{p.vx*=Math.pow(.975,k);p.vy=p.vy*Math.pow(.975,k)+(p.g??.05)*k;p.x+=p.vx*k;p.y+=p.vy*k;
        x.globalCompositeOperation='lighter';x.globalAlpha=Math.max(0,Math.min(1,p.life));x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.s*(p.tw?(.6+Math.random()*.6):1),0,7);x.fill();x.globalAlpha=1;x.globalCompositeOperation='source-over';}
      keep.push(p);
    }
    this.p=keep;
    if(this.p.length||this.show)this.raf=requestAnimationFrame(tt=>this.loop(tt));else{this.raf=0;x.clearRect(0,0,W,H)}
  },
  COLORS:['#de5b5b','#f4a5a5','#4f8cff','#ffd76a','#2fbf71','#ff5d8f','#c9a2ff','#ff9f43','#ffffff'],
  confetti(x,y,n,ang,spread,pow){this.start();for(let i=0;i<n;i++){const a=ang+(Math.random()-.5)*spread,v=pow*(.5+Math.random()*.7);this.p.push({k:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.3,ph:Math.random()*6,w:6+Math.random()*6,h:4+Math.random()*5,c:this.COLORS[i%this.COLORS.length],life:1.6+Math.random(),decay:.006})}},
  rain(n){this.start();for(let i=0;i<n;i++)this.p.push({k:'conf',x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.8,vx:(Math.random()-.5)*1.5,vy:1+Math.random()*2,r:Math.random()*6,vr:(Math.random()-.5)*.25,ph:Math.random()*6,w:6+Math.random()*6,h:4+Math.random()*5,c:this.COLORS[i%this.COLORS.length],life:3,decay:.004})},
  rocket(big){this.start();const W=innerWidth,H=innerHeight;const c=['#ffd76a','#4f8cff','#ff5d8f','#2fbf71','#c9a2ff','#ff9f43','#7ff0ff'][Math.random()*7|0];
    const ty=H*(.15+Math.random()*.35);this.p.push({k:'rock',x:W*(.15+Math.random()*.7),y:H+10,vx:(Math.random()-.5)*1.5,vy:-Math.sqrt(2*.06*(H-ty)),c,big,life:9,decay:0})},
  boom(x,y,c,big){
    const n=big?140:80,sp=big?6.5:4.5,ring=Math.random()<.35;
    for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,v=ring?sp:sp*(.25+Math.random()*.75);this.p.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:Math.random()<.2?'#ffffff':c,life:1+Math.random()*.4,decay:.012+Math.random()*.006,s:big?2.3:1.8,g:.045,tw:Math.random()<.4})}
    this.p.push({k:'spark',x,y,vx:0,vy:0,c:'#ffffff',life:.35,decay:.05,s:big?60:40,g:0});
    SND.boom(big);
  },
  startShow(rate,big){this.stopShow();this.start();this.show=setInterval(()=>{this.rocket(big&&Math.random()<.5);if(Math.random()<.35)setTimeout(()=>this.rocket(big),180)},rate)},
  stopShow(){clearInterval(this.show);this.show=null}
};

const SND={

    const S={1:[['C5',0,.2],['E5',.1,.2],['G5',.2,.4]],
      2:[['C5',0,.18],['E5',.12,.18],['G5',.24,.18],['C6',.36,.6]],
      3:[['G4',0,.15],['C5',.15,.15],['E5',.3,.15],['G5',.45,.35],['E5',.8,.15],['G5',.95,.9],['C6',.95,.9],['E6',.95,.9]],
      4:[['C5',0,.14],['C5',.14,.14],['C5',.28,.14],['C5',.42,.5],['A5',.95,.45],['B5',1.4,.45],['C6',1.85,.25],['B5',2.1,.12],['C6',2.25,1.4],['E6',2.25,1.4],['G6',2.25,1.4],['C4',2.25,1.4]]}[tier];
    S.forEach(([n,t,d])=>this.note(N[n],t,d,tier>=3?'sawtooth':'triangle',tier>=3?.07:.16));
    if(tier>=3)S.forEach(([n,t,d])=>this.note(N[n]/2,t,d,'triangle',.08));
  }catch(e){}},
  boom(big){try{if(!actx)return;const len=actx.sampleRate*.5,b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();f.type='lowpass';f.frequency.value=big?500:900;g.gain.value=big?.35:.2;s.buffer=b;s.connect(f);f.connect(g);g.connect(actx.destination);s.start()}catch(e){}}
};

  if(tier===2){FX.confetti(0,H,110,-Math.PI/3,.7,17);FX.confetti(W,H,110,-Math.PI*2/3,.7,17);setTimeout(()=>FX.rain(140),500)}
  if(tier===3){FX.confetti(W/2,H*.55,120,-Math.PI/2,1.8,15);FX.startShow(650,false);setTimeout(()=>FX.stopShow(),5500)}
  if(tier===4){FX.confetti(0,H,140,-Math.PI/3,.7,19);FX.confetti(W,H,140,-Math.PI*2/3,.7,19);for(let i=0;i<4;i++)setTimeout(()=>FX.rocket(true),i*220);
    setTimeout(()=>FX.rain(200),900);FX.startShow(480,true);}
}
function closeCel(){FX.stopShow();if(!celEl)return;const el=celEl;celEl=null;el.classList.remove('show');el.style.pointerEvents='none';setTimeout(()=>el.remove(),400)}

function achCard(){
  const c=db.history.length,got=MILESTONES.filter(m=>db.ach&&db.ach[m.n]).length;
  const next=MILESTONES.find(m=>m.n>c),prev=[...MILESTONES].reverse().find(m=>m.n<=c);
  const base=prev?prev.n:0,pct=next?Math.round(100*(c-base)/(next.n-base)):100;
  return `<div class="card tap" data-a="achOpen"><div class="achcard"><span class="big">${prev?prev.e:'🎁'}</span><div class="grow"><b>Logros · ${got}/${MILESTONES.length}</b>
   <div class="mute small">${next?`Próxima sorpresa en el entreno ${next.n} · ${next.n-c===1?'¡en el siguiente!':`faltan ${next.n-c}`}`:'¡Los tienes todos! Eres inmortal.'}</div>
   <div class="prog"><i style="width:${pct}%"></i></div></div></div></div>`;
}
function openAch(){
  openSheet(()=>`<div class="shead"><button data-a="close">Cerrar</button><b>Logros</b><button></button></div>
   <p class="mute small">Cada logro trae su sorpresa, y cuanto más lejos, más espectacular. Toca uno conseguido para volver a verlo.</p>
   <div class="medals">${MILESTONES.map(m=>{const ok=db.ach&&db.ach[m.n];return ok
     ?`<button class="medal g${m.tier}" data-a="achPlay" data-n="${m.n}"><div class="e">${m.e}</div><div class="tt">${esc(m.t)}</div><div class="n">Entreno ${m.n}</div><div class="n">${new Date(ok).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'2-digit'})}</div></button>`
     :`<div class="medal lock"><div class="e">🎁</div><div class="tt">¿?</div><div class="n">Entreno ${m.n}</div></div>`}).join('')}</div>`);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='celClose')closeCel();
  else if(a==='achOpen')openAch();
  else if(a==='achPlay'){const m=MILESTONES.find(x=>x.n===+el.dataset.n);if(m)celebrate(m,true)}
});

syncAch();
if(db.active)view='workout';
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
